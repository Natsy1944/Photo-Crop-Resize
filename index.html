<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Crop & Resize</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 520px;
      margin: auto;
      padding: 24px 18px;
      color: #222;
    }
    h1 { font-size: 28px; }
    p { color: #666; }
    label {
      display: block;
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      font-size: 17px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    button {
      width: 100%;
      font-size: 17px;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #0b63ce;
      color: white;
    }
    button.secondary { background: #555; }
    button:disabled { opacity: .45; }
    #status { margin-top: 16px; font-weight: 600; }
    #preview { max-width: 100%; margin-top: 18px; border-radius: 8px; display: none; }
    #info { font-size: 14px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Photo Crop & Resize</h1>
  <p>Automatically crop a photo to the required aspect ratio and resize it to exact pixel dimensions.</p>

  <label>Choose Photo</label>
  <input id="photo" type="file" accept="image/*">

  <label>Width (pixels)</label>
  <input id="width" type="number" min="1" value="400">

  <label>Height (pixels)</label>
  <input id="height" type="number" min="1" value="514">

  <button id="process" disabled>Crop & Resize</button>
  <img id="preview">
  <div id="info"></div>
  <div id="status"></div>
  <button id="files" class="secondary" disabled>Save to Files</button>
  <button id="share" class="secondary" disabled>Share</button>
  <canvas id="canvas" hidden></canvas>

  <script>
    let blob = null, name = 'resized-photo.jpg';
    const $ = id => document.getElementById(id);

    $('photo').onchange = () => {
      $('process').disabled = !$('photo').files.length;
    };

    $('process').onclick = () => {
      let f = $('photo').files[0],
          w = +$('width').value,
          h = +$('height').value;
      if (!f || !w || !h) return;
      $('status').textContent = 'Processing...';
      let im = new Image;
      im.onload = () => {
        let tr = w / h,
            sr = im.width / im.height,
            sx = 0, sy = 0,
            sw = im.width, sh = im.height;
        if (sr > tr) {
          sw = im.height * tr;
          sx = (im.width - sw) / 2;
        } else if (sr < tr) {
          sh = im.width / tr;
          sy = (im.height - sh) / 2;
        }
        $('canvas').width = w;
        $('canvas').height = h;
        $('canvas').getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
        $('canvas').toBlob(b => {
          blob = b;
          name = 'photo-' + w + 'x' + h + '.jpg';
          $('preview').src = URL.createObjectURL(b);
          $('preview').style.display = 'block';
          $('info').textContent = 'Output: ' + w + ' x ' + h + ' pixels';
          $('status').textContent = 'Photo generated successfully.';
          $('files').disabled = $('share').disabled = false;
        }, 'image/jpeg', .92);
      };
      im.src = URL.createObjectURL(f);
    };

    $('files').onclick = async () => {
      if (!blob) return;
      let f = new File([blob], name, { type: 'image/jpeg' });
      if (window.showSaveFilePicker) try {
        let h = await showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'JPEG image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
        }), x = await h.createWritable();
        await x.write(f);
        await x.close();
        $('status').textContent = 'Saved successfully.';
        return;
      } catch(e) { if (e.name === 'AbortError') return; }
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      $('status').textContent = 'Save started.';
    };

    $('share').onclick = async () => {
      if (blob && navigator.share) {
        try {
          await navigator.share({
            files: [new File([blob], name, { type: 'image/jpeg' })],
            title: 'Resized Photo'
          });
        } catch(e) {}
      }
    };
  </script>
</body>
</html>
